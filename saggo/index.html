<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hojas de Vida SAGGO</title>
<meta name="description" content="Inventario y hojas de vida de activos">
<meta name="theme-color" content="#173b65">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hojas de Vida">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  html,body{margin:0;height:100%;background:#eef3f7;font:15px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#182432;overflow:hidden}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#eef3f7}
  #splash{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:#eef3f7;transition:opacity .3s}
  #splash img{width:96px;height:96px;border-radius:22px;box-shadow:0 6px 20px #173b6533}
  #splash b{color:#173b65;font-size:19px}
  #splash small{color:#5b6b7b;max-width:320px}
  .spin{width:34px;height:34px;border:4px solid #d7e0e8;border-top-color:#167f9d;border-radius:50%;animation:s .8s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  #bar{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:540px;margin:auto;z-index:3;display:none;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border-left:5px solid #167f9d;border-radius:12px;padding:10px 12px;box-shadow:0 6px 24px #18365340}
  #bar.on{display:flex}
  #bar span{flex:1 1 200px;font-size:14px;line-height:1.35}
  #bar button{border:0;border-radius:9px;padding:9px 14px;font:700 14px system-ui,sans-serif;cursor:pointer}
  #barInstall{background:#173b65;color:#fff}
  #barClose{background:#e6edf3;color:#173b65}
</style>
</head>
<body>
<div id="splash"><img src="icon-192.png" alt=""><b>Hojas de Vida</b><div class="spin" id="spin"></div><small id="msg">Cargando…</small></div>
<iframe id="app" title="Hojas de Vida SAGGO" allow="camera; microphone; geolocation; clipboard-read; clipboard-write; screen-wake-lock; fullscreen; web-share; autoplay"></iframe>
<div id="bar" role="dialog" aria-live="polite"><span id="barText"></span><button id="barInstall" type="button">Instalar</button><button id="barClose" type="button">Ahora no</button></div>
<script>
// Enlace de la app con el código de esta empresa (?empresa=…): entra directo al usuario y contraseña de la empresa.
// Es lo único que cambia entre empresas, junto con el nombre del manifiesto.
const APP_URL = 'https://script.google.com/macros/s/AKfycbxM7-blO3ZBzpJ_TAYnbBfkLPMaOqSWuwyvDRjiI-AHFPAgw2DWOjRQ8wwuLsgBcyR0lQ/exec?empresa=saggo';
(function () {
  const frame = document.getElementById('app'), splash = document.getElementById('splash'), msg = document.getElementById('msg'), spin = document.getElementById('spin');
  let standalone = false;
  try { standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; } catch (e) {}
  function show(text, busy) { splash.style.display = 'flex'; splash.style.opacity = '1'; msg.textContent = text; spin.style.display = busy ? '' : 'none'; }
  function load() {
    if (!/^https:\/\/script\.google\.com\//.test(APP_URL)) return show('Falta configurar el enlace de la app en index.html (APP_URL).', false);
    if (!navigator.onLine) return show('Sin conexión a internet. La app se abre sola cuando vuelva la conexión.', false);
    show('Cargando…', true);
    frame.src = APP_URL;
  }
  frame.addEventListener('load', function () { if (!frame.getAttribute('src')) return; splash.style.opacity = '0'; setTimeout(function () { splash.style.display = 'none'; }, 300); });
  addEventListener('online', function () { if (splash.style.display !== 'none') load(); });
  // «Actualizar ahora» del aviso de actualización: la app avisa con {hv: 'reload'} y aquí se recarga todo (solo si viene de la app de este marco).
  addEventListener('message', function (ev) {
    if (!ev.data || ev.data.hv !== 'reload') return;
    let w = ev.source, mine = false;
    try { for (let i = 0; w && i < 6; i++) { if (w === frame.contentWindow) { mine = true; break; } if (w === w.parent) break; w = w.parent; } } catch (e) {}
    if (!mine) return;
    show('Actualizando…', true); location.reload();
  });
  load();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
  // Botón «Instalar» (Android/computador) o indicación para iPhone
  const bar = document.getElementById('bar'), text = document.getElementById('barText'), btn = document.getElementById('barInstall'), KEY = 'hvInstalarOculto';
  let deferred = null;
  function hidden() { try { return Date.now() - Number(localStorage.getItem(KEY) || 0) < 3 * 86400000; } catch (e) { return false; } }
  document.getElementById('barClose').onclick = function () { bar.classList.remove('on'); try { localStorage.setItem(KEY, String(Date.now())); } catch (e) {} };
  addEventListener('beforeinstallprompt', function (ev) {
    ev.preventDefault(); deferred = ev;
    if (standalone || hidden()) return;
    text.textContent = '📲 Instale la app: queda con su ícono y se abre sin el navegador.'; btn.style.display = ''; bar.classList.add('on');
  });
  btn.onclick = function () { if (!deferred) return; deferred.prompt(); deferred.userChoice.finally(function () { deferred = null; bar.classList.remove('on'); }); };
  addEventListener('appinstalled', function () { bar.classList.remove('on'); });
  const ios = /iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (ios && !standalone && !hidden()) { text.innerHTML = '📲 Para instalarla toque <b>Compartir</b> (cuadro con flecha ↑) y luego <b>Agregar a inicio</b>.'; btn.style.display = 'none'; bar.classList.add('on'); }
})();
</script>
</body>
</html>
